services:
  - type: web
    name: governance-management-backend
    runtime: docker
    plan: free
    rootDir: backend
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: DEMO_SEED_ENABLED
        value: "false"
      - key: STORAGE_BACKEND
        value: local
      - key: FILE_STORAGE_PATH
        value: storage/documents
      - key: SSO_ENABLED
        value: "false"
